  const cell = (x, z) => (x < 0 || z < 0 || x >= nW || z >= nH) ? 's' : grid[z * nW + x];

  for (let s = 0; s <= (nW - 1) + (nH - 1); s++) {
    const x0 = Math.max(0, s - (nH - 1));
    const x1 = Math.min(nW - 1, s);
    for (let x = x0; x <= x1; x++) {
      const z = s - x;
      const ch = cell(x, z);
      if (!walkable(ch)) continue;
      const p = iso(x, z);
      const hw = TW / 2 * zoom, hh = TH / 2 * zoom, wh = WH * zoom;
      const top = [p[0], p[1] - hh], right = [p[0] + hw, p[1]];
      const bottom = [p[0], p[1] + hh], left = [p[0] - hw, p[1]];
      if (!walkable(cell(x + 1, z))) face(right, bottom, wh, COL.wallE);
      if (!walkable(cell(x, z + 1))) face(bottom, left, wh, COL.wallS);
      let topCol = ((x + z) % 2 === 1) ? COL.floorB : COL.floorA;
      if (ch === 't') topCol = COL.threshold;
      else if (ch === 'd') topCol = COL.stairDown;
      else if (ch === 'u') topCol = COL.stairUp;
      poly(top, right, bottom, left, topCol);
    }
  }

  if (show.lights) {
    for (const lt of L.lights) {
      const p = iso(lt.x, lt.z);
      const rad = (12 + (lt.r || 1) * 9) * zoom;
      const warm = (lt.kind && lt.kind.indexOf('candle') >= 0) ? '150,200,255' : '255,180,95';
      glow(p[0], p[1], rad, warm);
    }
  }
  if (show.rooms) {
    ctx.lineWidth = 1; ctx.strokeStyle = COL.room;
    for (const r of L.rooms) {
      const a = iso(r.x, r.z), b = iso(r.x + r.w, r.z), c2 = iso(r.x + r.w, r.z + r.h), e = iso(r.x, r.z + r.h);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      ctx.lineTo(c2[0], c2[1]); ctx.lineTo(e[0], e[1]); ctx.closePath(); ctx.stroke();
    }
  }
  const sp = iso(L.spawn.x, L.spawn.z);
  ctx.beginPath(); ctx.arc(sp[0], sp[1] - 2 * zoom, 5 * zoom, 0, Math.PI * 2);
  ctx.fillStyle = COL.spawn; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = COL.bg; ctx.stroke();

  const s = L.stats;
  document.getElementById('depth').textContent =
    'depth ' + L.depth + (DATA.length > 1 ? '  (' + (cur + 1) + '/' + DATA.length + ')' : '');
  document.getElementById('stat').textContent =
    'seed ' + L.seed + ' · ' + L.theme + ' · rooms ' + s.rooms +
    ' · corridors ' + (s.connections - s.loops) + ' · loops ' + s.loops +
    ' · doors ' + s.doors + ' · walkable ' + s.walkable;
  document.getElementById('fp').textContent = 'fingerprint ' + L.fingerprint;
  document.getElementById('nav').style.display = DATA.length > 1 ? 'flex' : 'none';
}

function fitZoom() {
  const L = level();
  const isoW = (L.width + L.height - 2) * (TW / 2);
  const isoH = (L.width + L.height - 2) * (TH / 2);
  zoom = Math.max(0.3, Math.min(2.2, Math.min(W * 0.9 / isoW, H * 0.78 / isoH)));
  pan.x = 0; pan.y = 0;
}

function cellAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const L = level();
  const mx = clientX - rect.left, my = clientY - rect.top;
  const cx = W / 2 + pan.x;
  const cy = H / 2 + pan.y - (L.width + L.height - 2) * (TH / 4) * zoom;
  const a = (mx - cx) / (TW / 2 * zoom);
  const b = (my - cy) / (TH / 2 * zoom);
  return [Math.round((a + b) / 2), Math.round((b - a) / 2)];
}

function go(delta) {
  if (cur + delta < 0 || cur + delta >= DATA.length) return;
  cur += delta; fitZoom(); draw();
}

canvas.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY, moved: false }; });
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  pan.x += dx; pan.y += dy; drag.x = e.clientX; drag.y = e.clientY; draw();
});
window.addEventListener('mouseup', (e) => {
  if (drag && !drag.moved) {
    const c = cellAt(e.clientX, e.clientY);
    const L = level();
    if (c[0] >= 0 && c[1] >= 0 && c[0] < L.width && c[1] < L.height) {
      const ch = L.grid[c[1] * L.width + c[0]];
      if (ch === 'd') go(1);
      else if (ch === 'u') go(-1);
    }
  }
  drag = null;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  zoom = Math.max(0.3, Math.min(3, zoom * f)); draw();
}, { passive: false });
window.addEventListener('keydown', (e) => {
  const step = 40;
  if (e.key === 'ArrowLeft') pan.x += step;
  else if (e.key === 'ArrowRight') pan.x -= step;
  else if (e.key === 'ArrowUp') pan.y += step;
  else if (e.key === 'ArrowDown') pan.y -= step;
  else if (e.key === '+' || e.key === '=') zoom = Math.min(3, zoom * 1.1);
  else if (e.key === '-' || e.key === '_') zoom = Math.max(0.3, zoom / 1.1);
  else if (e.key === 'd' || e.key === ']') { go(1); return; }
  else if (e.key === 'u' || e.key === '[') { go(-1); return; }
  else if (e.key === 'f') { fitZoom(); return; }
  else return;
  draw();
});
window.addEventListener('resize', () => { fit(); draw(); });

document.getElementById('next').onclick = () => go(1);
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('fit').onclick = () => { fitZoom(); draw(); };
document.getElementById('tRooms').onchange = (e) => { show.rooms = e.target.checked; draw(); };
document.getElementById('tLights').onchange = (e) => { show.lights = e.target.checked; draw(); };

fit(); fitZoom(); draw();
</script>
</body>
